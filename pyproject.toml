[project]
name = "ev-uav"
version = "0.1.0"
description = "EV-UAV event point cloud segmentation baseline."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "ripser>=0.6.15",
    "spconv-cu126>=2.3.8",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
vis = [
    "matplotlib>=3.10.0",
    "open3d>=0.19.0",
]

[dependency-groups]
dev = [
    "ninja>=1.11.1.4",
    "pyrefly>=0.20.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "platform_system != 'Darwin'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "platform_system != 'Darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
